[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cognis-chargeguard"
version = "0.1.1"
description = "Monitors dispute/chargeback feeds, flags fraud-rate threshold breaches (VAMP/Visa), and drafts representment evidence packets."
authors = [{name = "Cognis Digital", email = "suite@cognis.digital"}]
license = {text = "LicenseRef-COCL-1.0"}
requires-python = ">=3.10"
readme = "README.md"
keywords = ["cognis-digital", "cognis-neural-suite", "fintech", "chargeguard"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
connect = ["cognis-connect @ git+https://github.com/cognis-digital/cognis-connect.git"]
mcp = ["mcp>=1.0"]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://cognis.digital"
Repository = "https://github.com/cognis-digital/chargeguard"

[project.scripts]
"chargeguard-emit" = "chargeguard.connect:emit_main"
chargeguard = "chargeguard.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["chargeguard"]

[tool.hatch.metadata]
allow-direct-references = true
