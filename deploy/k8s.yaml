apiVersion: apps/v1
kind: Deployment
metadata: { name: chargeguard, labels: { app: chargeguard } }
spec:
  replicas: 1
  selector: { matchLabels: { app: chargeguard } }
  template:
    metadata: { labels: { app: chargeguard } }
    spec:
      containers:
        - name: chargeguard
          image: ghcr.io/cognis-digital/chargeguard:latest
          ports: [{ containerPort: 8000 }]
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata: { name: chargeguard }
spec:
  selector: { app: chargeguard }
  ports: [{ port: 80, targetPort: 8000 }]
